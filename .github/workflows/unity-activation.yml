# CyVerse — request a Unity activation file (.alf) for CI.
#
# You only run this ONCE, to obtain the UNITY_LICENSE secret that
# webgl-deploy.yml needs. Full walkthrough in SETUP.md → "Getting the Unity
# CI secrets". Short version:
#
#   1. Actions tab → "Unity — Request Activation File" → Run workflow
#   2. Open the finished run, download the artifact, unzip it → Unity_v2022.x.alf
#   3. Go to https://license.unity3d.com/manual, upload the .alf,
#      pick "Unity Personal" → download the resulting .ulf file
#   4. Settings → Secrets and variables → Actions → New repository secret:
#        UNITY_LICENSE  = the ENTIRE contents of the .ulf file (it's XML)
#        UNITY_EMAIL    = your Unity account email
#        UNITY_PASSWORD = your Unity account password
#   5. Delete this workflow file — it isn't needed again.
#
# The .ulf is a licence credential: keep it in secrets, never commit it.
name: Unity — Request Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          # Must match ProjectSettings/ProjectVersion.txt, or the licence
          # won't apply to the version the build actually runs.
          unityVersion: 2022.3.40f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
